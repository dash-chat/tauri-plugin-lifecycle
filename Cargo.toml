[package]
name = "tauri-plugin-lifecycle"
version = "0.1.0"
description = "React to iOS/Android app background/foreground transitions from Rust, with a UIBackgroundTask assertion so async teardown completes before suspension."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/.tauri"]
links = "tauri-plugin-lifecycle"
license = "MIT"

[dependencies]
tauri = { version = "2" }
serde = "1"
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
