[package]
name = "tauri-plugin-ios-lifecycle"
version = "0.1.0"
description = "React to iOS app background/foreground transitions from Rust, with a UIBackgroundTask assertion so async teardown completes before suspension."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/.tauri"]
links = "tauri-plugin-ios-lifecycle"
license = "MIT"

[dependencies]
tauri = { version = "2" }
serde = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
